name: Sync distribution repo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sync_docs:
        description: Sync user manuals to public distribution repo
        type: boolean
        default: true
      mirror_release_tag:
        description: Mirror a specific release tag (e.g. v1.2.1-mac). Leave empty to skip.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: type gh >/dev/null 2>&1 || (type apt-get >/dev/null 2>&1 && sudo apt-get update && sudo apt-get install -y gh)

      - name: Sync docs and optional release
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_SYNC_TOKEN }}
          SYNC_RELEASE: ${{ github.event_name == 'release' && 'true' || (inputs.mirror_release_tag != '' && 'true' || 'false') }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.mirror_release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "DISTRIBUTION_SYNC_TOKEN secret is not configured."
            echo "Create a fine-grained PAT with Contents: Read/Write on ARIAKE_OCTA-distribution,"
            echo "and Contents: Read on MNV_analysis_pro, then add it as repository secret."
            exit 1
          fi
          chmod +x .github/scripts/sync-distribution.sh
          .github/scripts/sync-distribution.sh
