name: Mirror Optovue 3mm patch

# The cloud agent token cannot call workflow_dispatch on
# "Sync distribution repo". This run uses that workflow's script with the
# same inputs: sync docs from main, mirror v1.2.4-optovue-3mm-patch.
on:
  push:
    branches:
      - cursor/optovue-3mm-device-select-6c1c
    paths:
      - .github/workflows/mirror-optovue-3mm-patch.yml

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main manuals and sync script
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Mirror v1.2.4-optovue-3mm-patch
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_SYNC_TOKEN }}
          SYNC_RELEASE: "true"
          RELEASE_TAG: v1.2.4-optovue-3mm-patch
          GITHUB_REPOSITORY: yasuoyanagijp-maker/MNV_analysis_pro
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "DISTRIBUTION_SYNC_TOKEN secret is not configured."
            exit 1
          fi
          chmod +x .github/scripts/sync-distribution.sh
          .github/scripts/sync-distribution.sh
