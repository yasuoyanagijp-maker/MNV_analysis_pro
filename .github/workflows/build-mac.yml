name: Build macOS release

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: Target architecture
        type: choice
        options:
          - arm64
          - x86_64
        default: arm64
      app_version:
        description: Release version (e.g. 1.2.4)
        type: string
        default: "1.2.4"
      attach_to_release:
        description: Upload zip onto existing GitHub Release v{version}-mac
        type: boolean
        default: true
  push:
    tags:
      - "v*-mac"

permissions:
  contents: write

jobs:
  build-mac:
    # arm64 → macos-14 (Apple Silicon).
    # x86_64 → macos-15-intel (native Intel). macos-13 is retired;
    # macos-14 cannot produce an Intel zip (arm64 Python / PyInstaller).
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_arch == 'x86_64' && 'macos-15-intel' || 'macos-14' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select build architecture
        id: arch
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "target=${{ inputs.target_arch }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.app_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=arm64" >> "$GITHUB_OUTPUT"
            ver="${GITHUB_REF_NAME#v}"
            ver="${ver%-mac}"
            echo "version=${ver}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: ${{ steps.arch.outputs.target == 'x86_64' && 'x64' || 'arm64' }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Verify runner and venv architecture
        run: |
          chmod +x tools/require_mac_python_arch.sh
          echo "uname -m: $(uname -m)"
          .venv/bin/python -c "import platform,sys; print('python', sys.version); print('machine', platform.machine())"
          ./tools/require_mac_python_arch.sh .venv/bin/python "${{ steps.arch.outputs.target }}"

      - name: Build .app (ad-hoc, no notarization)
        run: |
          chmod +x build_mac.sh tools/verify_mac_app_arch.sh tools/strip_mac_codesign_poison.sh tools/verify_mac_codesign_ready.sh tools/require_mac_python_arch.sh tools/mac_openssl_coexistence.py package_mac_release.sh
          if [[ "${{ steps.arch.outputs.target }}" == "arm64" ]]; then
            ./build_mac.sh --skip-notarize --clean --arm64
          else
            ./build_mac.sh --skip-notarize --clean --intel
          fi

      - name: Package release ZIP
        run: |
          if [[ "${{ steps.arch.outputs.target }}" == "arm64" ]]; then
            ./package_mac_release.sh --arm64 --version "${{ steps.arch.outputs.version }}"
          else
            ./package_mac_release.sh --intel --version "${{ steps.arch.outputs.version }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ steps.arch.outputs.target }}-v${{ steps.arch.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach zip to existing GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.attach_to_release == true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TARGET: ${{ steps.arch.outputs.target }}
          APP_VERSION: ${{ steps.arch.outputs.version }}
        run: |
          TAG="v${APP_VERSION}-mac"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TAG} does not exist yet; zip stays in Actions artifacts only."
            exit 0
          fi
          gh release upload "$TAG" dist/*.zip --clobber --repo "${{ github.repository }}"
          echo "Uploaded dist/*.zip to ${TAG}"
          if [[ "$BUILD_TARGET" != "x86_64" ]]; then
            exit 0
          fi
          NOTES="$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body)"
          if echo "$NOTES" | grep -q "ARIAKE_OCTA_macOS_Intel"; then
            echo "Release notes already mention the Intel zip."
            exit 0
          fi
          {
            printf '%s\n' "$NOTES"
            echo ""
            echo "- Intel Mac: \`ARIAKE_OCTA_macOS_Intel_v${APP_VERSION}.zip\`"
          } > /tmp/release-notes.md
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file /tmp/release-notes.md
          echo "Appended Intel zip bullet to ${TAG} notes."

      - name: Publish GitHub Release (tag push only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TARGET: ${{ steps.arch.outputs.target }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="$(mktemp)"
          cat > "${NOTES_FILE}" << 'EOF'
          ## macOS release

          Built with PR #43 + PR #44 Mac packaging fixes:
          - strip `*.dist-info` from Frameworks (fixes codesign / M3 launch SIGKILL)
          - ad-hoc signing **without** Hardened Runtime (research distribution)
          - `wrapper.py` runs FastAPI in-process on Darwin (no spawn SIGKILL)
          - `インストール.command` ad-hoc re-signs after copy to /Applications
          - post-build architecture verification (PyInstaller slice; Flet universal2 allowed)

          ## Install
          1. Unzip and run `インストール.command` via **right-click → Open**
          2. See `Macインストール手順.txt` in the zip

          ## Artifacts
          EOF
          if [[ "${BUILD_TARGET}" == "arm64" ]]; then
            cat >> "${NOTES_FILE}" << 'EOF'
          - Apple Silicon (M1/M2/M3/M4): `ARIAKE_OCTA_mac.zip` (arm64 only)
          EOF
          else
            cat >> "${NOTES_FILE}" << 'EOF'
          - Intel Mac: `ARIAKE_OCTA_macOS_Intel_v*.zip`
          EOF
          fi
          sed -i '' 's/^          //' "${NOTES_FILE}"
          gh release create "$TAG" dist/*.zip \
            --title "macOS Release ${TAG}" \
            --notes-file "${NOTES_FILE}" \
            --repo "${{ github.repository }}"
